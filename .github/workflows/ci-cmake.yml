name: CMake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        library: [shared, static]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # CMAKE_Fortran_COMPILER=NOTFOUND stops Eigen's blas/ subdirectory from
      # probing for a Fortran compiler (its check_language call skips the probe
      # when the cache variable is already defined), which otherwise fails on
      # Windows runners where MinGW gfortran is on the PATH alongside the MSVC
      # toolchain.
      - name: Configure
        run: >
          cmake -S . -B build
          ${{ runner.os == 'Windows' && '-G Ninja' || '' }}
          -DOAR_BUILD_EXAMPLES=ON
          -DOAR_BUILD_SHARED_LIBRARY=${{ matrix.library == 'shared' && 'ON' || 'OFF' }}
          -DCMAKE_Fortran_COMPILER=NOTFOUND

      - name: Build
        run: cmake --build build --parallel

      # PATH must include the build dir so the examples find oar.dll in the
      # shared-library configuration on Windows. The label filter selects the
      # oar examples and obr unit tests while skipping the tests that
      # FetchContent'd dependencies (Eigen) register but never build.
      - name: Run tests
        shell: bash
        run: |
          export PATH="$PWD/build:$PATH"
          ctest --test-dir build -L 'oar|obr' --output-on-failure
